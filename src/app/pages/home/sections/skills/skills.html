<section class="skills" [id]="sectionId" aria-labelledby="skills-title">
  <div class="skills__inner">
    <h2 class="skills__title" id="skills-title" i18n="@@skills.title">Skill set</h2>
    <ul class="skills__list">
      @for (skill of skills; track skill.icon) {
        <li class="skills__item">
          <img class="skills__icon" [src]="skill.icon" alt="" width="71" height="75" />
          <span class="skills__name">{{ skill.name }}</span>
        </li>
      }
    </ul>
  </div>
</section>
